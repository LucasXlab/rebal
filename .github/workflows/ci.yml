name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: 测试（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.11.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # 测试不许跳过：跳过的用例按失败处理
      - name: 确认没有跳过的用例
        run: |
          out=$(npm test 2>&1)
          echo "$out" | tail -20
          if echo "$out" | grep -qE '^ℹ skipped [1-9]'; then
            echo "::error::有被跳过的测试用例"
            exit 1
          fi

  smoke:
    name: 冒烟（离线示例全流程）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm
      - run: npm ci
      - name: init --demo → status → plan → check
        run: |
          set -e
          work=$(mktemp -d)
          cd "$work"
          node "$GITHUB_WORKSPACE/bin/rebal.js" init --demo
          node "$GITHUB_WORKSPACE/bin/rebal.js" status
          node "$GITHUB_WORKSPACE/bin/rebal.js" plan --cash 6000
          node "$GITHUB_WORKSPACE/bin/rebal.js" check
          node "$GITHUB_WORKSPACE/bin/rebal.js" prices

  release:
    name: 打标签发版
    needs: [test, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: npm
      - run: npm ci
      - name: 校验 tag 与 package.json / src/version.js 一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          src=$(node --input-type=module -e "import('./src/version.js').then(m => console.log(m.TOOL_VERSION))")
          echo "tag=$tag package.json=$pkg src/version.js=$src"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$src" ]; then
            echo "::error::版本号不一致：tag=$tag package.json=$pkg src/version.js=$src"
            exit 1
          fi
      - run: npm test
      - name: 打包
        run: npm pack
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rebal-*.tgz
          generate_release_notes: true
